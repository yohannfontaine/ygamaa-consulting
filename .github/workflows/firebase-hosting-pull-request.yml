# Déploie un canal de preview Firebase par pull request, après les contrôles.
# Le job ne tourne pas sur les PR issues de forks : elles n'ont pas accès aux
# secrets, l'étape de déploiement échouerait.

name: Rebuild on PR
"on": pull_request
jobs:
  build_and_preview:
    if: "${{ github.event.pull_request.head.repo.full_name == github.repository }}"
    runs-on: ubuntu-latest
    # Le GITHUB_TOKEN est en lecture seule par défaut. L'action Firebase crée
    # un check run et commente la PR avec l'URL de preview : sans ces droits
    # elle échoue en 403 « Resource not accessible by integration ».
    # Déclarer une permission met toutes les autres à none, d'où contents.
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --global yarn
      - run: yarn install --frozen-lockfile
      - run: yarn test
      - run: yarn typecheck
      - run: yarn generate
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_YGAMAA_CONSULTING }}"
          projectId: ygamaa-consulting
